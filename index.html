<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1493DA">
<title>情報ボックス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左に新規プロジェクト・検索・プロジェクト一覧、右にプロジェクトの記録。スマホでは一覧と詳細を切替 */
:root{
  --bg:#FFFFFF; --surface:#F4F7FA; --raised:#FFFFFF; --line:#DDE4EB; --line-strong:#C3CED8;
  --fg:#111417; --muted:#5A6672; --faint:#8995A1;
  --accent:#1493DA; --accent-soft:#E3F2FB; --on-accent:#FFFFFF;
  --sub:#EF3E77; --sub-soft:#FDE7EF;
  --shadow:0 1px 2px rgba(17,20,23,.06),0 8px 24px rgba(17,20,23,.08);
  --f-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#151A1F; --raised:#1A2026; --line:#29313A; --line-strong:#3A4550;
  --fg:#E8EDF1; --muted:#9AA6B2; --faint:#6E7B87;
  --accent:#3AAAEB; --accent-soft:#12283A; --on-accent:#06121B;
  --sub:#F45C8E; --sub-soft:#3A1724;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#151A1F; --raised:#1A2026; --line:#29313A; --line-strong:#3A4550;
  --fg:#E8EDF1; --muted:#9AA6B2; --faint:#6E7B87;
  --accent:#3AAAEB; --accent-soft:#12283A; --on-accent:#06121B;
  --sub:#F45C8E; --sub-soft:#3A1724;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.7}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;white-space:nowrap}
.mark{width:22px;height:22px;border-radius:5px;background:var(--fg);position:relative;flex:none}
.mark::before{content:"";position:absolute;left:4px;right:4px;top:9px;height:2px;background:var(--bg)}
.mark::after{content:"";position:absolute;left:8px;width:6px;top:5px;height:3px;border-radius:1px;background:var(--accent)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.me img{width:24px;height:24px;border-radius:50%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--raised);cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap;user-select:none;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--sub);border-color:var(--sub)}
.btn.small{height:30px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.free{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);line-height:16px}
.btn.primary .free{background:rgba(255,255,255,.22);color:inherit}
.quota{font-size:10.5px;color:var(--faint);font-weight:400}

.banner{padding:10px 16px;background:var(--accent-soft);color:var(--fg);font-size:13px;border-bottom:1px solid var(--line)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,390px) 1fr}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.main{min-width:0;min-height:0;overflow:auto}

.quick{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.quick textarea{width:100%;min-height:44px;max-height:160px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--raised);padding:9px 11px;resize:vertical;line-height:1.55}
.quick textarea:focus{border-color:var(--accent)}
.quick-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quick-row .hint{margin-left:auto}

.tabs{display:flex;gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 10px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);margin-left:4px}
.tab .count.alert{color:var(--sub)}
.pane{display:flex;flex-direction:column;min-height:0;flex:1}
.pane-head{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--raised);padding:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--raised);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:10.5px;opacity:.7;margin-left:3px}

.list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--raised)}
.item[aria-current="true"]{background:var(--raised);border-color:var(--line-strong);box-shadow:var(--shadow)}
.item>.date,.item>.title,.item>.meta{grid-column:1}
.item .date{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.item .title{font-weight:700;font-size:14px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0;overflow-wrap:anywhere}
.item .meta{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);min-width:0}
.item .thumb{grid-column:2;grid-row:1/4;width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--line);align-self:center}
.star{color:var(--sub)}
.pill{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid var(--line-strong);color:var(--muted);background:var(--raised);white-space:nowrap}
.pill.t-打合せ{border-color:var(--fg);color:var(--fg)}
.pill.t-メモ{border-color:var(--sub);color:var(--sub)}
.pill.t-資料・情報{border-color:var(--accent);color:var(--accent)}
.pill.private{border-style:dashed}
.pill.todo{background:var(--sub-soft);border-color:transparent;color:var(--sub)}
.tag{color:var(--accent);font-size:11.5px}
.empty-list{padding:28px 16px;color:var(--muted);font-size:13px;text-align:center}

.todo-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px;border-bottom:1px solid var(--line)}
.todo-row input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}
.todo-row .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.todo-row.done .t{text-decoration:line-through;color:var(--faint)}
.todo-row .sub{grid-column:2;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.todo-row .due.over{color:var(--sub);font-weight:700}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-align:left}

.ask{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.ask textarea{width:100%;min-height:84px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--raised);padding:10px;resize:vertical}
.answer{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.hint{font-size:12px;color:var(--muted)}
.examples{display:flex;flex-direction:column;gap:6px}
.examples button{text-align:left;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.examples button:hover{border-color:var(--accent);color:var(--fg)}

.sheet{max-width:880px;margin:0 auto;padding-block:24px 64px;padding-inline:24px;display:flex;flex-direction:column;gap:22px}
.back{display:none;align-self:flex-start}
.sheet-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sheet-head h1{font-family:var(--f-display);font-size:24px;line-height:1.35;margin:0;flex:1 1 320px;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.sheet-actions{display:flex;gap:6px;flex-wrap:wrap}
.metaline{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.metaline a{color:var(--accent);overflow-wrap:anywhere}
.minutes{border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.minutes table{width:100%;border-collapse:collapse}
.minutes th{width:96px;text-align:left;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--muted);background:var(--surface);padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.minutes td{padding:9px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.minutes tr:last-child th,.minutes tr:last-child td{border-bottom:0}
.sec h2{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:8px;height:8px;background:var(--fg);border-radius:2px}
.sec.summary h2::before{background:var(--accent)}
.sec.todos h2::before{background:var(--sub)}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.summary .prose{background:var(--accent-soft);padding:12px 14px;border-radius:var(--r);max-width:none}
.decisions{margin:0;padding-left:1.3em}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.photo .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.photo .new{position:absolute;left:6px;top:6px;font-size:10.5px;background:var(--accent);color:var(--on-accent);padding:1px 6px;border-radius:4px;font-weight:700}
.byline{font-size:12px;color:var(--faint)}

.form{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.f-full{grid-column:1/-1}.f-2{grid-column:span 2}.f-3{grid-column:span 3}
.inp,.form select,.form textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--raised);padding:8px 10px;min-height:38px}
.inp.title{font-family:var(--f-display);font-size:18px}
.form textarea{resize:vertical;line-height:1.7}
.ta-body{min-height:240px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;min-height:38px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:var(--raised);cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-left:1px solid var(--line-strong)}
.todo-edit{display:flex;flex-direction:column;gap:6px}
.todo-e{display:grid;grid-template-columns:auto 1fr 140px 150px auto;gap:6px;align-items:center}
.todo-e input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.read-bar{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.read-bar p{margin:0;font-size:13px}
.read-bar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.progress{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--fg);color:var(--bg)}
.progress p{margin:0;flex:1;font-size:13.5px}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 0;background:var(--bg);border-top:1px solid var(--line)}
.savebar .state{margin-right:auto;font-size:12.5px;color:var(--muted)}
.savebar .state.dirty{color:var(--sub)}

.home h1{font-family:var(--f-display);font-size:26px;line-height:1.4;margin:0;text-wrap:balance}
.home .lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.way{border:1px solid var(--line-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--raised);cursor:pointer;text-align:left}
.way:hover{border-color:var(--accent)}
.way .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.way b{font-family:var(--f-display);font-size:16px}
.way span{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:500}
.stat .l{font-size:12px;color:var(--muted)}
.stat.alert .n{color:var(--sub)}
.recent{display:flex;flex-direction:column;gap:2px}

.modal{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-card{background:var(--raised);border-radius:12px;max-width:420px;width:100%;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.modal-card h3{margin:0;font-family:var(--f-display);font-size:17px}
.modal-card p{margin:0;color:var(--muted);font-size:13.5px}
.modal-card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px;cursor:zoom-out}
.lightbox img{max-height:100%;max-width:100%;object-fit:contain}

.quick-row .dest{flex:1 1 140px;min-height:30px;height:30px;padding:2px 8px;font-size:12.5px;width:auto}
.projects{padding:8px 8px 10px;border-bottom:1px solid var(--line)}
.projects-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.projlist{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.proj{display:flex;align-items:center;gap:4px;border-radius:6px}
.proj[aria-current="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
.proj-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:6px 10px;text-align:left;font-size:13.5px;color:var(--fg);border-radius:6px}
.proj-main:hover{background:var(--raised)}
.proj .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj[aria-current="true"] .pname{font-weight:700}
.proj .n{font-size:11px;color:var(--faint)}
.proj-gear{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:4px 8px;border-radius:4px;white-space:nowrap}
.proj-gear:hover{background:var(--raised);color:var(--accent)}
.mrow.invite .em{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pill.proj{border-color:var(--line-strong);color:var(--fg);background:var(--surface);max-width:16em;overflow:hidden;text-overflow:ellipsis}
.pill.private{border-style:dashed}
#e-dest{max-width:100%}
/* simplified dashboard */
.side-head{padding:14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.btn.block{width:100%;height:40px}
.projlist{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px;max-height:none}
.projlist .proj{width:100%;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;border:0;background:none;cursor:pointer;padding:9px 12px;text-align:left;border-radius:8px;color:var(--fg)}
.projlist .proj:hover{background:var(--raised)}
.projlist .proj[aria-current="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.projlist .pname{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projlist .psub{grid-column:1;font-size:11.5px;color:var(--muted)}
.projlist .n{grid-column:2;grid-row:1/3;font-size:12px;color:var(--faint)}
.side-empty{padding:10px 12px;line-height:1.6}
.proj-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.proj-title{flex:1 1 280px;min-width:0}
.proj-title h1{font-family:var(--f-display);font-size:26px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.proj-title p{margin:4px 0 0}
.btn.share{height:40px;padding:0 18px;border-color:var(--accent);color:var(--accent);font-size:14px}
.btn .ico{display:inline-flex}
.btn.share:hover{background:var(--accent-soft)}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.row-snip{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.row .thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex:none}
.empty{display:flex;flex-direction:column;gap:6px;padding:36px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}
.empty b{color:var(--fg);font-size:15px}
.modal-card.wide{max-width:560px;max-height:calc(100% - 32px);overflow:auto;gap:14px}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------- scopes: "private" or a project id ---------- */
const scopeRef = scope => scope===PRIV ? S.fs.collection("users").doc(S.uid) : S.fs.collection("projects").doc(scope);

/* ---------- ui helpers ---------- */
let toastT;

function banner(msg){ const b=$("#banner"); b.textContent=msg||""; b.hidden=!msg; }
function confirmBox(title,msg,okLabel,danger){
  return new Promise(res=>{
    $("#mTitle").textContent=title; $("#mMsg").textContent=msg;
    const ok=$("#mOk"),cancel=$("#mCancel"),m=$("#modal");
    ok.textContent=okLabel||"OK"; ok.className="btn "+(danger?"danger":"primary");
    m.hidden=false; ok.focus();
    const done=v=>{ m.hidden=true; ok.onclick=cancel.onclick=null; res(v); };
    ok.onclick=()=>done(true); cancel.onclick=()=>done(false);
  });
}
function lightbox(src){ $("#lbImg").src=src; $("#lightbox").hidden=false; }

async function guard(fn){
  if (S.dirty && !(await confirmBox("保存していない変更があります","このまま移動すると、入力内容は失われます。","破棄して移動",true))) return;
  S.dirty=false; fn();
}
function dbErr(e,what){
  const c=e&&e.code;
  if (c==="permission-denied") toast("この操作の権限がありません。プロジェクトのオーナーに権限を確認してください。");
  else if (c==="resource-exhausted") toast("無料枠の上限に達しました。時間をおくか、不要な記録や写真を削除してください。");
  else if (c==="unavailable") toast("オフラインです。通信が戻ると自動で保存されます。");
  else if (c==="invalid-argument") toast("データが大きすぎます。写真の枚数や本文を減らしてください。");
  else toast(`${what}に失敗しました。通信状況を確認して再度お試しください。`);
}

/* ---------- images ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch { return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("decode")); im.src=URL.createObjectURL(file); }); }
}
function drawTo(src,side){
  const w=src.width,hh=src.height,s=Math.min(1,side/Math.max(w,hh));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(hh*s));
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(src,0,0,c.width,c.height); return c;
}
async function prepImage(file){
  const bmp=await loadBitmap(file);
  let side=1800,q=0.8,data="";
  for (let i=0;i<7;i++){ data=drawTo(bmp,side).toDataURL("image/jpeg",q); if(data.length<300000) break; side=Math.round(side*0.85); q=Math.max(0.5,q-0.06); }
  return { data, thumb:drawTo(bmp,260).toDataURL("image/jpeg",0.6), src:file };
}
async function getImageData(scope,id){
  if (S.imgCache.has(id)) return S.imgCache.get(id);
  try { const s=await imgsCol(scope).doc(id).get(); const d=s.exists?s.data().data:null; if(d) S.imgCache.set(id,d); return d; }
  catch { return null; }
}
function loadImg(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }

/* ---------- free OCR (runs in this browser with Tesseract.js) ---------- */
let ocrWorkerP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.append(s); }); }
function ocrLog(m){
  const map={"loading tesseract core":"読み取りエンジンを準備中","initializing tesseract":"読み取りエンジンを起動中","loading language traineddata":"日本語の辞書データを読み込み中","initializing api":"読み取りエンジンを起動中","recognizing text":"文字を読み取り中"};
  if (S.busy!=="ocr") return;
  S.prog.stage=map[m.status]||S.prog.stage||"準備中";
  if (m.status==="recognizing text") S.prog.pct=Math.round((m.progress||0)*100);
  updateProgress();
}
function getOcrWorker(){
  if (ocrWorkerP) return ocrWorkerP;
  ocrWorkerP=(async()=>{
    if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    return await Tesseract.createWorker(["jpn","eng"],1,{logger:ocrLog,errorHandler:()=>{}});
  })();
  ocrWorkerP.catch(()=>{ ocrWorkerP=null; });
  return ocrWorkerP;
}
function prepForOcr(img){
  const c=drawTo(img,2400); const x=c.getContext("2d");
  const d=x.getImageData(0,0,c.width,c.height); const p=d.data;
  let sum=0; for(let i=0;i<p.length;i+=4){ const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; p[i]=g; sum+=g; }
  const mean=sum/(p.length/4);
  for(let i=0;i<p.length;i+=4){ let g=(p[i]-mean)*1.5+mean+18; g=g<0?0:g>255?255:g; p[i]=p[i+1]=p[i+2]=g; }
  x.putImageData(d,0,0); return c;
}
// 影に強い前処理：場所ごとの明るさに合わせて白黒化（Sauvola法）
function prepAdaptive(img){
  const c=drawTo(img,2400); 
  const W=c.width,H=c.height,x=c.getContext("2d"),d=x.getImageData(0,0,W,H),p=d.data;
  const g=new Float32Array(W*H); for(let i=0,j=0;i<p.length;i+=4,j++) g[j]=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
  const I=new Float64Array((W+1)*(H+1)), I2=new Float64Array((W+1)*(H+1));
  for(let y=1;y<=H;y++){let rs=0,rs2=0;for(let xx=1;xx<=W;xx++){const v=g[(y-1)*W+xx-1];rs+=v;rs2+=v*v;I[y*(W+1)+xx]=I[(y-1)*(W+1)+xx]+rs;I2[y*(W+1)+xx]=I2[(y-1)*(W+1)+xx]+rs2;}}
  const r=Math.max(12,Math.round(Math.max(W,H)/50)), k=0.2, R=128;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){
    const x0=Math.max(0,xx-r),x1=Math.min(W,xx+r+1),y0=Math.max(0,y-r),y1=Math.min(H,y+r+1),n=(x1-x0)*(y1-y0);
    const s1=I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0];
    const s2=I2[y1*(W+1)+x1]-I2[y0*(W+1)+x1]-I2[y1*(W+1)+x0]+I2[y0*(W+1)+x0];
    const m=s1/n, sd=Math.sqrt(Math.max(0,s2/n-m*m)), t=m*(1+k*(sd/R-1));
    const v=g[y*W+xx]>t?255:0, o=(y*W+xx)*4; p[o]=p[o+1]=p[o+2]=v; }
  x.putImageData(d,0,0); return c;
}
function dropJunk(t){ // 記号だけ・ローマ字の断片だけの行を除く
  return t.split("\n").map(l=>l.replace(/[ー\-_.。,、・'"`:;|]+$/,"").trimEnd()).filter(l=>{const k=(l.replace(/[ー一－—_=~〜]/g,"").match(/[\u3040-\u30ff\u3400-\u9fff]/g)||[]).length; const a=(l.match(/[0-9A-Za-z]/g)||[]).length; return k>=2 || (a>=4&&k>=1);}).join("\n");
}

// 業務でよく使う言葉（読み取り後の1文字違い補正に使う）
const OCR_DICT = `

function fixBullets(t){return t.split("\n").map(l=>l.replace(/^\s*[*+.?"'`•·･‧\-－=~〜]\s*(?=[\u3040-\u30ff\u3400-\u9fff])/,"・")).join("\n");}
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return 2;let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;return Math.max(a.length-i-j,b.length-i-j);}
function diffIsKana(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;return /[\u3040-\u309f]/.test(a.slice(i,a.length-j)+b.slice(i,b.length-j));}
function dictFix(t,dict){
  const words=[...new Set(dict)].filter(w=>[...w].length>=3).sort((a,b)=>b.length-a.length);
  const set=new Set(words);
  return t.split("\n").map(line=>{
    let out=line;
    for(const w of words){const L=w.length;if(out.includes(w))continue;
      for(const n of [L,L+1,L-1]){if(n<3)continue;let done=false;
        for(let i=0;i+n<=out.length;i++){const sub=out.slice(i,i+n);if(sub===w||set.has(sub))continue;
          if(!/[\u3040-\u30ff\u3400-\u9fff]/.test(sub[0]+sub[sub.length-1]))continue;
          if(lev1(sub,w)===1&&!diffIsKana(sub,w)){ // 同じ位置で他の辞書語にも1文字違いなら曖昧なので直さない
            const amb=words.some(o=>o!==w&&o.length===n&&lev1(sub,o)===1);
            if(!amb){out=out.slice(0,i)+w+out.slice(i+n);done=true;break;}}}
        if(done)break;}}
    return out;}).join("\n");}
function userVocab(){ // 保存済みの記録によく出てくる言葉（3文字以上・2回以上）も辞書に加える
  const cnt=new Map();
  for (const [,m] of S.notes) for (const [,n] of m){ const t=(n.title||"")+"\n"+(n.body||"")+"\n"+(n.attendees||"");
    for (const w of t.match(/[\u4e00-\u9fff々]{3,8}|[\u30a0-\u30ffー]{3,12}/g)||[]) cnt.set(w,(cnt.get(w)||0)+1); }
  for (const [,p] of S.projects) if(p.name) for (const w of p.name.match(/[\u4e00-\u9fff々]{3,8}|[\u30a0-\u30ffー]{3,12}/g)||[]) cnt.set(w,9);
  return [...cnt].filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,1500).map(([w])=>w);

async function runFreeOcr(){
  const d=S.draft; if(!d||S.busy) return;
  const srcs=[
    ...d.pending.map(p=>async()=>p.src?await loadBitmap(p.src).catch(()=>loadImg(p.data)):await loadImg(p.data)),
    ...d.images.map(p=>async()=>{ const x=await getImageData(d.orig.scope,p.id); return x?await loadImg(x):null; })];
  if (!srcs.length){ toast("読み取る写真がありません"); return; }
  S.busy="ocr"; S.cancelOcr=false; S.prog={text:"読み取りの準備をしています（初回のみ数MBを読み込みます）",stage:"準備中",pct:0}; renderMain();
  try {
    const worker=await getOcrWorker();
    const texts=[], vocab=userVocab();
    for (let i=0;i<srcs.length;i++){
      if (S.cancelOcr) break;
      S.prog={text:`写真 ${i+1}/${srcs.length} を読み取っています`,stage:"文字を読み取り中",pct:0}; updateProgress();
      const img=await srcs[i](); if(!img) continue;
      // 暗い背景の反転・傾き補正・複数の前処理と倍率で読み取り、行ごとに確信度の高い結果を採用
      const r=await OCRX.recognize(worker,img,{cancelled:()=>S.cancelOcr}); if (S.cancelOcr) break;
      const t=dictFix(fixBullets(r.text),[...OCR_DICT,...vocab]);
      if (t) texts.push(srcs.length>1?`――― 写真${i+1} ―――\n${t}`:t);
    }
    if (S.cancelOcr){ toast("読み取りを停止しました"); return; }
    const all=texts.join("\n\n");
    if (!all.trim()){ toast("文字を読み取れませんでした。明るい場所で真上から、文字が大きく写るように撮影してください"); return; }
    // もう一度読み取ったときは、前回の読み取り結果を置き換える（重複させない）
    if (d.ocrText && d.body.includes(d.ocrText)) d.body=d.body.replace(d.ocrText,all);
    else d.body=d.body.trim()?d.body.trim()+"\n\n"+all:all;
    d.ocrText=all;
    if (!d.title.trim()){ const first=all.split("\n").map(s=>s.replace(/^―+.*―+$/,"").trim()).find(s=>s.length>=2); if(first) d.title=first.slice(0,40); }
    S.dirty=true;
    toast("読み取りました。誤字があれば直してから保存してください");
  } catch { toast("読み取りエンジンを読み込めませんでした。通信状況を確認して、もう一度お試しください"); }
  finally { S.busy=null; if(S.mode==="edit") renderMain(); }
}

      h("div",{class:"field f-full"},h("span",{class:"lbl"},`写真（${total}/${MAX_IMG}枚）`),
        h("div",{class:"photos"},photos.map(({p,i,kind})=>{
          const img=h("img",{src:kind==="new"?p.data:(S.imgCache.get(p.id)||p.thumb),alt:"写真"}); img.onclick=()=>lightbox(img.src);
          if (kind==="saved"&&!S.imgCache.has(p.id)&&d.orig) getImageData(d.orig.scope,p.id).then(x=>{ if(x) img.src=x; });
          return h("div",{class:"photo"},img,kind==="new"?h("span",{class:"new"},"未保存"):null,
            h("button",{class:"x",type:"button","aria-label":"この写真を外す",onclick:()=>{ if(kind==="new") d.pending.splice(i,1); else { d.removed.push(p.id); d.images.splice(i,1);} markDirty(); renderMain(); }},"×")); }),
          total<MAX_IMG?h("label",{class:"photo",for:"addPhotoInput",style:"display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:13px;border-style:dashed"},"＋ 写真を追加"):null))),
    h("div",{class:"savebar"},
      h("span",{class:"state"+(S.dirty?" dirty":""),id:"saveState"},busy==="save"?"保存しています…":(S.dirty?"未保存の変更があります":(isNew?"まだ保存されていません":"保存済み"))),
      h("button",{class:"btn ghost",type:"button",onclick:back},"キャンセル"),
      h("button",{class:"btn primary",type:"button",onclick:saveDraft,disabled:!!busy},"保存"))));
  bind("e-title","title"); bind("e-date","date"); bind("e-place","place"); bind("e-att","attendees");
  bind("e-body","body"); bind("e-dec","decisions"); bind("e-tags","tags");
  $("#e-fmt")?.addEventListener("change",e=>{ d.format=e.target.value; markDirty(); });
  updateProgress();
}
function destHint(scope){
  if (scope===PRIV) return "あなただけが見られます。";
  const p=S.projects.get(scope); if(!p) return "";
  const names=Object.keys(p.members||{}).map(e=>displayName(e,scope));
  return `このプロジェクトのメンバー${names.length}人（${names.slice(0,6).join("、")}${names.length>6?" ほか":""}）が見られます。`;
}
async function addPhotosToDraft(files){
  const d=S.draft, room=MAX_IMG-d.images.length-d.pending.length;
  const list=[...files].slice(0,Math.max(0,room));
  if (files.length>list.length) toast(`写真は1件につき${MAX_IMG}枚までです`);
  let failed=0;
  for (const f of list){ try { d.pending.push(await prepImage(f)); } catch { failed++; } }
  if (failed) toast(`${failed}枚の画像を読み込めませんでした（JPEG・PNGでお試しください）`);
  if (list.length-failed>0) markDirty();
}
async function saveDraft(){
  const d=S.draft; if(!d||S.busy) return;
  const scope=canEdit(d.dest)?d.dest:PRIV;
  const id=d.id||newId(), prev=d.orig;
  S.busy="save"; renderMain();
  try {
    const imgs=[];
    for (const im of d.images){
      if (prev&&prev.scope!==scope){ const x=await getImageData(prev.scope,im.id); if(x) await imgsCol(scope).doc(im.id).set({data:x,noteId:id}); }
      imgs.push({id:im.id,thumb:im.thumb});
    }
    for (const p of d.pending){ const iid=newId(); await imgsCol(scope).doc(iid).set({data:p.data,noteId:id}); S.imgCache.set(iid,p.data); imgs.push({id:iid,thumb:p.thumb}); }
    d.pending=[]; d.images=imgs;
    const now=Date.now(), tp=d.type, firstLine=(d.body.trim().split("\n")[0]||"").slice(0,50);
    const doc={kind:"note",type:tp,
      title:d.title.trim()||firstLine||`${fmtDate(d.date)} の${tp}`, date:(tp!=="打合せ"?(d.orig&&d.date?d.date:today()):d.date)||today(),
      format:tp==="打合せ"?d.format:"", place:(tp==="打合せ"||tp==="資料・情報")?d.place.trim():"", attendees:tp==="打合せ"?d.attendees.trim():"",
      tags:d.tags.split(/[,、，]/).map(x=>x.replace(/^#/,"").trim()).filter(Boolean).slice(0,10),
      body:d.body, decisions:tp==="打合せ"?d.decisions.trim():"",
      todos:d.todos.filter(t=>(t.text||"").trim()).map(t=>({text:t.text.trim(),owner:(t.owner||"").trim(),due:t.due||"",done:!!t.done})),
      images:imgs, source:d.source||"手入力", star:!!d.star, ocrText:d.ocrText||"",
      ...baseDoc(), createdBy:d.createdBy||S.uid, createdByName:d.createdByName||S.name||S.email, createdAt:d.createdAt||now, updatedAt:now};
    await notesCol(scope).doc(id).set(doc);
    if (!S.notes.has(scope)) S.notes.set(scope,new Map());
    S.notes.get(scope).set(id,doc);
    if (prev&&prev.scope!==scope){
      await notesCol(prev.scope).doc(prev.id).delete(); S.notes.get(prev.scope)?.delete(prev.id);
      for (const im of imgs) await imgsCol(prev.scope).doc(im.id).delete().catch(()=>{});
    }
    for (const rid of d.removed) await imgsCol(prev?prev.scope:scope).doc(rid).delete().catch(()=>{});
    S.busy=null; S.dirty=false; S.draft=null; S.sel={scope,id}; S.mode="view";
    toast(`保存しました（${scopeName(scope)}）`);
    renderProjects(); renderList(); renderTodos(); renderMain();
  } catch(e){ S.busy=null; dbErr(e,"保存"); renderMain(); }
}

/* ---------- imports ---------- */

$("#photoInput").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  if (S.dirty&&!(await confirmBox("保存していない変更があります","新しく作ると、入力内容は失われます。","破棄して続ける",true))) return;
  S.dirty=false;
  S.draft=blankDraft({source:"写真",type:"メモ"}); S.sel=null; S.mode="edit"; renderList(); renderMain(); setView("detail");
  await addPhotosToDraft(files); renderMain();
  if (S.draft.pending.length) runFreeOcr();
});
$("#addPhotoInput").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length||!S.draft) return;
  await addPhotosToDraft(files); renderMain();
});
let mammothP=null;
function loadMammoth(){
  if (window.mammoth) return Promise.resolve(window.mammoth);
  return mammothP ||= loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js").then(()=>window.mammoth).catch(e=>{ mammothP=null; throw e; });
}
$("#fileInput").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if (S.dirty&&!(await confirmBox("保存していない変更があります","ファイルを取り込むと、入力内容は失われます。","破棄して続ける",true))) return;
  S.dirty=false;
  let text="";
  try {
    if (/\.docx$/i.test(f.name)){ toast("Wordファイルを読み込んでいます…"); const m=await loadMammoth(); text=(await m.extractRawText({arrayBuffer:await f.arrayBuffer()})).value; }
    else text=await f.text();
  } catch { toast("ファイルを読み込めませんでした。.docx / .txt / .md に対応しています"); return; }
  text=text.replace(/\r\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  const base=f.name.replace(/\.[^.]+$/,""); const dm=base.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  S.draft=blankDraft({source:"ファイル",type:"メモ",title:base,body:text,date:dm?`${dm[1]}-${dm[2]}-${dm[3]}`:today()});
  S.sel=null; S.mode="edit"; S.dirty=true; renderList(); renderMain(); setView("detail");
  toast("取り込みました。保存先と種類を選んで保存してください");
});
document.addEventListener("keydown",e=>{
  if ((e.ctrlKey||e.metaKey)&&e.key==="s"&&S.mode==="edit"){ e.preventDefault(); saveDraft(); }
  if (e.key==="Escape"){ if(!$("#lightbox").hidden) $("#lightbox").hidden=true; else if(!$("#shareModal").hidden) closeModal(); }
});
window.addEventListener("beforeunload",e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

/* ---------- render ---------- */
function renderMain(){
  const main=$("#main"), top=main.scrollTop; main.replaceChildren();
  if (S.mode==="edit"&&S.draft) renderEdit(main);
  else if (S.mode==="view"&&S.sel) renderView(main);
  else if (S.mode==="join") renderJoin(main);
  else renderHome(main);
  main.scrollTop=top;
}
let renderQueued=false;
function onData(){
  if (renderQueued) return; renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false;
    if (S.fProj!==PRIV&&!S.projects.has(S.fProj)) S.fProj=PRIV;
    renderProjects(); renderList(); renderTodos(); renderQuickDest();
    if (S.mode!=="edit"&&S.mode!=="join") renderMain(); if (sharePid) renderShare();
  });
}

/* ---------- subscriptions ---------- */
function subscribeNotes(scope){
  if (S.noteSubs.has(scope)) return;
  const un=notesCol(scope).onSnapshot(snap=>{
    const m=new Map(); snap.forEach(d=>{ const x=d.data(); if(x&&x.kind==="note") m.set(d.id,x); });
    S.notes.set(scope,m); S.loadedScopes.add(scope); onData();
  },e=>{ S.loadedScopes.add(scope); if(scope===PRIV) banner("記録を読み込めませんでした。ページを再読み込みしてください。"); onData(); });
  S.noteSubs.set(scope,un);
}
function unsubscribeNotes(scope){ const u=S.noteSubs.get(scope); if(u) u(); S.noteSubs.delete(scope); S.notes.delete(scope); S.loadedScopes.delete(scope); }
function stopSubs(){ for (const u of S.unsubs) try{u();}catch{} S.unsubs=[]; for (const k of [...S.noteSubs.keys()]) unsubscribeNotes(k); if(inviteUnsub){ inviteUnsub(); inviteUnsub=null; } }
function startApp(){
  $("#gate").hidden=true; $("#app").hidden=false;
  S.projects=new Map(); S.notes=new Map(); S.loadedScopes=new Set();
  renderTop(); backToList();
  subscribeNotes(PRIV);
  let first=true;
  S.unsubs.push(S.fs.collection("projects").where("memberEmails","array-contains",S.email).onSnapshot(snap=>{
    const next=new Map(); snap.forEach(d=>next.set(d.id,d.data()));
    for (const k of [...S.projects.keys()]) if(!next.has(k)) unsubscribeNotes(k);
    S.projects=next;
    for (const k of next.keys()) subscribeNotes(k);
    onData();
    if (first){ first=false; if(S.pendingJoin) handleJoin(); }
  },()=>{ banner("プロジェクトを読み込めませんでした。Firestoreのルール（README手順3）を確認してください。"); if(first){ first=false; if(S.pendingJoin) handleJoin(); } }));
}

/* ---------- gate (login / setup) ---------- */
function gate(...content){
  $("#app").hidden=true; $("#gate").hidden=false;
  $("#gateCard").replaceChildren(h("div",{class:"brand"},h("span",{class:"mark","aria-hidden":"true"}),h("b",null,CFG.appName||"情報ボックス")),...content);
}
function showLogin(){
  const inviting=!!S.pendingJoin;
  gate(h("h1",null,inviting?"プロジェクトに招待されています":"ログインしてください"),
    h("p",null,inviting?"Googleアカウントでログインすると、招待されたプロジェクトに参加できます。":"Googleアカウントでログインすると、自分の記録と、参加しているプロジェクトの記録を見られます。"),
    h("div",null,h("button",{class:"btn primary",type:"button",onclick:login},"Googleでログイン")));
}
async function login(){
  const prov=new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
  try { await S.auth.signInWithPopup(prov); }
  catch(e){
    if (e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) S.auth.signInWithRedirect(prov);
    else if (e&&e.code==="auth/unauthorized-domain") toast("このURLはまだFirebaseに登録されていません（README手順4）");
    else if (e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") toast("ログインできませんでした。もう一度お試しください");
  }
}
function onUser(u){
  stopSubs();
  if (!u){ S.uid=null; showLogin(); return; }
  S.uid=u.uid; S.email=(u.email||"").toLowerCase(); S.name=u.displayName||"";
  startApp();
}
function boot(){
  readJoinFromUrl();
  const fb=CFG.firebase||{};
  if (!window.firebase||!fb.apiKey||!fb.projectId){
    gate(h("h1",null,"初期設定が必要です"),h("p",null,"firebase-config.js に Firebase の設定を入力してください。手順は README.md にあります。"));
    return;
  }
  firebase.initializeApp(fb);
  S.auth=firebase.auth(); S.fs=firebase.firestore();
  try { S.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); } catch {}
  S.auth.onAuthStateChanged(onUser);
}
boot();
})();
</script>
